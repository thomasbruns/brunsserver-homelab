<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>brunsserver</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%234cc2ff'/%3E%3Crect x='3' y='4' width='10' height='3' fill='%230f1216'/%3E%3Crect x='3' y='9' width='10' height='3' fill='%230f1216'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="top">
    <div class="wrap bar">
      <span class="brand">brunsserver</span>
      <nav>
        {% for key, href, label in nav %}
        <a href="{{ href }}" class="{{ 'on' if key == active else '' }}">{{ label }}</a>
        {% endfor %}
      </nav>
    </div>
  </header>
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
  <script src="/static/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
